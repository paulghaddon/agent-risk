[project]
name = "agent-risk"
version = "0.1.0"
description = "Adversarial pre-deployment validation harness for AI agents at the MCP tool boundary"
requires-python = ">=3.11"
dependencies = ["typer", "rich"]

[project.scripts]
agent-risk = "agent_risk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_risk"]
